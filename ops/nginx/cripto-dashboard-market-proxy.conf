proxy_ssl_server_name on;
proxy_set_header Host $proxy_host;
proxy_set_header Accept-Language "en";
proxy_set_header Authorization "";
proxy_set_header Cookie "";
proxy_connect_timeout 5s;
proxy_read_timeout 10s;
proxy_send_timeout 10s;
proxy_cache cripto_dashboard_market;
proxy_cache_valid 200 5m;
proxy_cache_valid 429 30s;
proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
proxy_cache_lock on;
add_header Cache-Control "public, max-age=300" always;
add_header X-Market-Cache $upstream_cache_status always;
