# Include this snippet in both /cripto-dashboard/ locations in Nginx.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://api.coingecko.com https://min-api.cryptocompare.com https://api.coincap.io https://api.alternative.me https://api.blockchain.info https://blockchain.info https://mempool.space; img-src 'self' data: https://assets.coincap.io https://assets.coingecko.com https://www.cryptocompare.com https://via.placeholder.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:;" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
