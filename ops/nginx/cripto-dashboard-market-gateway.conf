# Include this file inside the HTTPS server block, before the SPA location.
location ^~ /cripto-dashboard/api/market/coingecko/ {
    proxy_pass https://api.coingecko.com/api/v3/;
    include /etc/nginx/snippets/cripto-dashboard-market-proxy.conf;
}

location ^~ /cripto-dashboard/api/market/cryptocompare/ {
    proxy_pass https://min-api.cryptocompare.com/data/;
    include /etc/nginx/snippets/cripto-dashboard-market-proxy.conf;
}

location ^~ /cripto-dashboard/api/market/blockchain/ {
    proxy_pass https://api.blockchain.info/;
    include /etc/nginx/snippets/cripto-dashboard-market-proxy.conf;
}

location ^~ /cripto-dashboard/api/market/mempool/ {
    proxy_pass https://mempool.space/;
    include /etc/nginx/snippets/cripto-dashboard-market-proxy.conf;
}

location ^~ /cripto-dashboard/api/market/alternative/ {
    proxy_pass https://api.alternative.me/;
    include /etc/nginx/snippets/cripto-dashboard-market-proxy.conf;
}
